apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: router-kubelet-config
spec:
  machineConfigPoolSelector:
    matchLabels:
      pools.operator.machineconfiguration.openshift.io/router: ""
  autoSizingReserved: false
  kubeletConfig:
    maxPods: 150
    podPidsLimit: 4096
    systemReserved:
      cpu: 500m
      memory: 2Gi
      ephemeral-storage: 1Gi
    evictionHard:
      memory.available: 500Mi
      nodefs.available: 10%
      imagefs.available: 15%
    imageGCHighThresholdPercent: 80
    imageGCLowThresholdPercent: 70
