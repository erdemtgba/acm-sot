apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: odm
  labels:
    pools.operator.machineconfiguration.openshift.io/odm: ""
spec:
  maxUnavailable: 1
  machineConfigSelector:
    matchExpressions:
      - key: machineconfiguration.openshift.io/role
        operator: In
        values: [worker, odm]
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/odm: ""
