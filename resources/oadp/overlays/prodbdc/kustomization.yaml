apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      acm-sot/environment: "prodbdc"

patches:
  - path: patch-dpa.yaml
    target:
      kind: DataProtectionApplication
      name: dpa
  - path: patch-schedule.yaml
