apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-nodename-usage
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: exclude-system
      expression: "!object.metadata.namespace.startsWith('openshift') && !object.metadata.namespace.startsWith('kube-')"
  validations:
    - expression: "!has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: spec.nodeName doğrudan kullanılamaz; nodeSelector/affinity kullanınız.
