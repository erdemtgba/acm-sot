apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      retention: 7d
      resources:
        requests:
          cpu: 200m
          memory: 2Gi
    alertmanager:
      enabled: true
      enableAlertmanagerConfig: true
