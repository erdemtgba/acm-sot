apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.example.local:25
      smtp_from: openshift-alerts@example.local
      smtp_require_tls: false
    inhibit_rules:
      - equal: [namespace, alertname]
        source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: default
      routes:
        - matchers: [alertname = Watchdog]
          receiver: "null"
    receivers:
      - name: "null"
      - name: default
        email_configs:
          - to: ocp-alerts@example.local
            send_resolved: true
