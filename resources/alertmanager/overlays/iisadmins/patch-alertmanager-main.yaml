apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.example.local:25
      smtp_from: openshift-alerts@example.local
      smtp_require_tls: false
    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: iisadmins
      routes:
        - matchers: [alertname = Watchdog]
          receiver: "null"
        - matchers: [severity = critical]
          receiver: iisadmins-critical
    receivers:
      - name: "null"
      - name: iisadmins
        email_configs:
          - to: iisadmins@example.local
            send_resolved: true
      - name: iisadmins-critical
        email_configs:
          - to: iisadmins-oncall@example.local
            send_resolved: true
