apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: virtual-worker
  labels:
    pools.operator.machineconfiguration.openshift.io/virtual-worker: ""
spec:
  maxUnavailable: 1
  machineConfigSelector:
    matchExpressions:
      - key: machineconfiguration.openshift.io/role
        operator: In
        values: [worker, virtual-worker]
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/virtual-worker: ""
