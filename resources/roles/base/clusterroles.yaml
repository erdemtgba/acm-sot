apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-viewer
rules:
  - apiGroups: ["", project.openshift.io]
    resources: [namespaces, projects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-readonly
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "false"
rules:
  - apiGroups: ["", apps, batch, route.openshift.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [machineconfiguration.openshift.io, config.openshift.io]
    resources: ["*"]
    verbs: [get, list, watch]
