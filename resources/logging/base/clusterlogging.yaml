apiVersion: logging.openshift.io/v1
kind: ClusterLogging
metadata:
  name: instance
  namespace: openshift-logging
spec:
  managementState: Managed
  collection:
    type: vector
    tolerations:
      - operator: Exists
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
---
apiVersion: logging.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: openshift-logging
spec:
  outputs:
    - name: remote-syslog
      type: syslog
      url: tls://syslog.example.local:6514
      secret:
        name: log-forwarder-tls
      syslog:
        rfc: RFC5424
        facility: local0
  pipelines:
    - name: all-logs
      inputRefs: [application, infrastructure, audit]
      outputRefs: [remote-syslog]
