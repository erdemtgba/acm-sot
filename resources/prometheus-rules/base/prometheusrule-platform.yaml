apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-custom-rules
  namespace: openshift-monitoring
spec:
  groups:
    - name: node.rules
      rules:
        - alert: NodeHighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} bellek kullanımı %90 üzerinde"
        - alert: NodeFilesystemAlmostFull
          expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} dolmak üzere"
    - name: pod.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} sürekli yeniden başlıyor"
