apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-resource-usage
  namespace: pod-resource-usage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-resource-usage
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-resource-usage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-resource-usage
subjects:
  - kind: ServiceAccount
    name: pod-resource-usage
    namespace: pod-resource-usage
