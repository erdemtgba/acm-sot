apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      acm-sot/environment: "prod"

patches:
  - path: patch-cronjob.yaml
  - path: patch-retention.yaml
  - path: patch-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: etcd-backup
