apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      acm-sot/change: "420"
      acm-sot/ocp-version: "4.20"

commonAnnotations:
  acm-sot/change-ticket: "CHG-TBD"

patches:
  - path: patch-ignition-version.yaml
    target:
      kind: MachineConfig
      name: .*-chrony
