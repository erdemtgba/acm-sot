apiVersion: v1
kind: Namespace
metadata:
  name: ldap-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ldap-group-syncer
  namespace: ldap-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ldap-group-syncer
rules:
  - apiGroups: ["", user.openshift.io]
    resources: [groups]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ldap-group-syncer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ldap-group-syncer
subjects:
  - kind: ServiceAccount
    name: ldap-group-syncer
    namespace: ldap-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: ldap-group-syncer
  namespace: ldap-sync
type: Opaque
stringData:
  bindPassword: CHANGEME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-group-syncer
  namespace: ldap-sync
data:
  ldap-group-sync.yaml: |
    kind: LDAPSyncConfig
    apiVersion: v1
    url: ldaps://ldap.example.local:636
    bindDN: CN=svc-openshift,OU=ServiceAccounts,DC=example,DC=local
    bindPassword:
      file: /etc/secrets/bindPassword
    ca: /etc/ldap-ca/ca.crt
    activeDirectory:
      usersQuery:
        baseDN: DC=example,DC=local
        scope: sub
        derefAliases: never
        filter: (objectClass=person)
        pageSize: 0
      userNameAttributes: [sAMAccountName]
      groupMembershipAttributes: [memberOf]
  whitelist.txt: |
    CN=ocp-admins,OU=Groups,DC=example,DC=local
    CN=ocp-users,OU=Groups,DC=example,DC=local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ldap-group-syncer
  namespace: ldap-sync
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: ldap-group-syncer
          restartPolicy: Never
          containers:
            - name: ldap-group-sync
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -c
                - oc adm groups sync --sync-config=/etc/config/ldap-group-sync.yaml --whitelist=/etc/config/whitelist.txt --confirm
              volumeMounts:
                - name: config
                  mountPath: /etc/config
                - name: secrets
                  mountPath: /etc/secrets
                - name: ldap-ca
                  mountPath: /etc/ldap-ca
          volumes:
            - name: config
              configMap:
                name: ldap-group-syncer
            - name: secrets
              secret:
                secretName: ldap-group-syncer
            - name: ldap-ca
              configMap:
                name: ldap-ca-sync
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-ca-sync
  namespace: ldap-sync
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGEME
    -----END CERTIFICATE-----
