- op: replace
  path: /spec/identityProviders/0/name
  value: ldap-dmz
- op: replace
  path: /spec/identityProviders/0/ldap/url
  value: ldaps://ldap.dmz.example.local:636/DC=dmz,DC=example,DC=local?sAMAccountName?sub?(objectClass=person)
- op: replace
  path: /spec/identityProviders/0/ldap/bindDN
  value: CN=svc-openshift,OU=ServiceAccounts,DC=dmz,DC=example,DC=local
