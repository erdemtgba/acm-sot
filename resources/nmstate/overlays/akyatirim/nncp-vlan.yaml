apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: akyatirim-vlan120
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  maxUnavailable: 1
  desiredState:
    interfaces:
      - name: bond0.120
        type: vlan
        state: up
        vlan:
          base-iface: bond0
          id: 120
        ipv4:
          enabled: false
        ipv6:
          enabled: false
