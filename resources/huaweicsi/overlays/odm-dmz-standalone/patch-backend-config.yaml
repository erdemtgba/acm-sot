apiVersion: v1
kind: ConfigMap
metadata:
  name: huawei-backend-config
  namespace: huawei-csi
data:
  csi.json: |
    {
      "backends": {
        "storage": "oceanstor-san",
        "name": "huawei-backend",
        "namespace": "huawei-csi",
        "urls": ["https://storage-odm-dmz.example.local:8088"],
        "pools": ["StoragePool-odm-dmz"],
        "parameters": {"protocol": "iscsi", "portals": ["CHANGEME"]}
      }
    }
