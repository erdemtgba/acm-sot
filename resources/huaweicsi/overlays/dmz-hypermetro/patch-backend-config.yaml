apiVersion: v1
kind: ConfigMap
metadata:
  name: huawei-backend-config
  namespace: huawei-csi
data:
  csi.json: |
    {
      "backends": {
        "storage": "oceanstor-san",
        "name": "huawei-backend",
        "namespace": "huawei-csi",
        "urls": ["https://storage-a.example.local:8088", "https://storage-b.example.local:8088"],
        "pools": ["StoragePool-dmz"],
        "parameters": {"protocol": "iscsi", "portals": ["CHANGEME"]}, "hyperMetroDomain": "hypermetro-domain-01", "metrovStorePairID": "CHANGEME"
      }
    }
