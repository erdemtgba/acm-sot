apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: huawei-csi
provisioner: csi.huawei.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backend: huawei-backend
  pool: StoragePool001
  volumeType: lun
  allocType: thin
  csi.storage.k8s.io/fstype: xfs
