apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

labels:
  - includeSelectors: false
    pairs:
      acm-sot/policy: "certexpiration"

configMapGenerator:
  - name: cert-expiration-scripts
    namespace: cert-expiration
    files:
      - check-certs.sh
    options:
      disableNameSuffixHash: true
