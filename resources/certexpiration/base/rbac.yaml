apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-expiration-checker
  namespace: cert-expiration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-expiration-checker
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-expiration-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-expiration-checker
subjects:
  - kind: ServiceAccount
    name: cert-expiration-checker
    namespace: cert-expiration
