apiVersion: v1
kind: ConfigMap
metadata:
  name: search-collector-config
  namespace: open-cluster-management-agent-addon
data:
  AllowedResources: |-
    - apiGroups: ["*"]
      resources: ["*"]
  DeniedResources: |-
    - apiGroups: [""]
      resources: ["secrets", "events"]
    - apiGroups: ["admission.k8s.io", "authentication.k8s.io"]
      resources: ["*"]
